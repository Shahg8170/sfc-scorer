<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SFC Games</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0C1B3D">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#EAEEF4;--ink:#14203A;--board:#0C1B3D;--chalk:#F3F5E8;--tape:#F7B500;--wk:#D9482B;--card:#FFFFFF;--line:#D3DAE6;--mute:#5D6B82;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0A1226;--ink:#E8ECF6;--card:#121C36;--line:#25335A;--mute:#8E9BB8}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px}
.wrap{max-width:480px;margin:0 auto;padding:14px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700}
h1{font-size:28px;margin:4px 0 12px}h2{font-size:20px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(12,27,61,.08)}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--page);color:var(--ink)}
textarea{min-height:110px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 14px;font-weight:600;background:var(--board);color:var(--chalk)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
button:active{transform:scale(.97)}
.primary{width:100%;margin-top:14px;background:var(--tape);color:#16221C;font-size:17px}
.ghost{background:transparent;color:var(--mute);padding:6px 4px;text-decoration:underline}
.danger{background:transparent;color:var(--wk);padding:6px 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:12px 2px}
.tabs button.on{background:var(--board);color:var(--chalk)}
.lg{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--tape);color:#16221C;display:grid;place-items:center;font-weight:700;font-family:"Barlow Condensed",sans-serif;font-size:20px}
.lg.s{width:30px;height:30px;font-size:15px}
.mute{color:var(--mute);font-size:14px}
.board{background:var(--board);color:var(--chalk);border-radius:16px;padding:16px;margin-bottom:12px}
.live{background:var(--wk);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:20px}
.team{font-size:16px;display:flex;align-items:center;gap:8px}
.big{font-size:64px;line-height:1}.sub{font-size:15px;opacity:.85}
.balls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;min-height:34px}
.b{min-width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;background:rgba(243,245,232,.15);padding:0 6px}
.b.f{background:var(--tape);color:#16221C}.b.w{background:var(--wk);color:#fff}.b.x{border:2px solid var(--tape)}
.msg{margin-top:10px;font-size:15px;color:var(--tape);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{font-size:22px;font-family:"Barlow Condensed",sans-serif;padding:14px 0}
.g4{background:var(--tape)!important;color:#16221C!important}
.g6{background:#FF8A1F!important;color:#16221C!important}
.gw{background:var(--wk)!important}
.ex{background:var(--card)!important;color:var(--ink)!important;border:2px solid var(--line);font-size:16px!important;font-family:Barlow,sans-serif!important}
.small{font-size:14px;color:var(--mute);text-align:center;margin:6px 0}
.pl{font-size:16px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}th,td{padding:5px 3px;text-align:left;border-bottom:1px solid var(--line)}.r{text-align:right}summary{cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;color:#F3F5E8;border-bottom:3px solid var(--tape);background:radial-gradient(circle at 92% -30%,rgba(247,181,0,.35),transparent 55%),radial-gradient(circle at 8% 130%,rgba(60,110,230,.35),transparent 50%),linear-gradient(135deg,#091431,#12275A 65%,#0C1B3D)}
.top img{width:46px;height:46px;flex:none}.hn{font-size:26px;line-height:1;letter-spacing:.3px}.hs{font-size:13px;opacity:.8;margin-top:2px}
.dot{margin-left:auto;flex:none;width:10px;height:10px;border-radius:50%;background:#8896B3}.hb{padding:8px 12px;font-size:13px;background:rgba(255,255,255,.14);color:#F3F5E8;border:1px solid rgba(255,255,255,.25)}
.hide{display:none}.tap{cursor:pointer}.ban{width:100%;aspect-ratio:8/3;object-fit:cover;border-radius:14px;display:block;margin:8px 0}.mom{border-left:4px solid var(--tape)}pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:var(--page);padding:8px;border-radius:8px;user-select:all}
.brand{display:flex;align-items:center;gap:12px;margin:2px 0 14px}.brand img{width:64px;height:64px}.bn{font-size:30px;line-height:1}
@media(prefers-reduced-motion:reduce){button:active{transform:none}}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chips button{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:10px 14px}
.chips button.on{background:var(--board);color:var(--chalk)}
.sc{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700}
.rd{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center;margin-top:8px}
.rd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a{color:var(--ink)}
</style>
</head>
<body>
<header class="top"><img src="icon-192.png" alt="Sports Fans Club logo"><div><div class="num hn">SFC Games</div><div class="hs">Sports Fans Club</div></div><span id="dot" class="dot"></span><button id="hb" class="hb">Scorer login</button></header>
<div class="wrap" id="app"></div>
<div class="wrap" style="padding-top:0;text-align:center"><a href="./" style="color:var(--mute)">Cricket Scorer</a><div class="mute" style="font-size:13px">Developed by Rauf Ahmad Shah</div></div>
<script type="module">
var G=[],SP="all",ADMIN=false,LOGINV=false,ONLINE=false,READY=false,NEWF=false,ID=null,ROWS=[],FB=null,fdb=null,fauth=null;
var SPORTS=[{k:"volleyball",n:"Volleyball",r:"Set",i:"\uD83C\uDFD0"},{k:"snooker",n:"Snooker",r:"Frame",i:"\uD83C\uDFB1"},{k:"badminton",n:"Badminton",r:"Set",i:"\uD83C\uDFF8"},{k:"tt",n:"Table Tennis",r:"Set",i:"\uD83C\uDFD3"},{k:"ludo",n:"Ludo",r:"Game",i:"\uD83C\uDFB2"},{k:"carrom",n:"Carrom",r:"Board",i:"\u26AB"},{k:"foosball",n:"Foosball",r:"Game",i:"\u26BD"}];
try{
  var BASE="https://www.gstatic.com/firebasejs/13.0.0/";
  var mods=await Promise.all([import(BASE+"firebase-app.js"),import(BASE+"firebase-database.js"),import(BASE+"firebase-auth.js")]);
  var cfg={
    apiKey:"AIzaSyCwHbbsftokpEcHGWTilVv7ADrv27xOn10",
    authDomain:"sfc-scorer.firebaseapp.com",
    databaseURL:"https://sfc-scorer-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"sfc-scorer",
    storageBucket:"sfc-scorer.firebasestorage.app",
    messagingSenderId:"508201459788",
    appId:"1:508201459788:web:c1db5b1c48c73d19ca94e9"};
  var fapp=mods[0].initializeApp(cfg);
  fdb=mods[1].getDatabase(fapp);fauth=mods[2].getAuth(fapp);
  FB={db:mods[1],auth:mods[2]};
}catch(e){FB=null}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function sp(k){return SPORTS.filter(function(x){return x.k==k})[0]||SPORTS[0]}
function find(id){return G.filter(function(g){return g.id==id})[0]}
function parseRd(s){return String(s||"").split(",").map(function(x){var p=x.split("-");return[parseFloat(p[0]),parseFloat(p[1])]}).filter(function(p){return !isNaN(p[0])&&!isNaN(p[1])})}
function tally(g){var a=0,b=0;parseRd(g.rd).forEach(function(p){if(p[0]>p[1])a++;else if(p[1]>p[0])b++});return[a,b]}
function winner(g){if(g.st!="fin")return"";if(g.res)return g.res;var t=tally(g);return t[0]>t[1]?"a":t[1]>t[0]?"b":"d"}
function resTxt(g){var w=winner(g);return w=="a"?g.a+" won":w=="b"?g.b+" won":w=="d"?"Draw":""}
function whenT(g){if(!g.when)return "Time not set";try{return new Date(g.when).toLocaleString([],{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}catch(e){return""}}
function toLocalIn(ts){var d=new Date(ts);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function put(g){if(!FB||!ADMIN)return;FB.db.set(FB.db.ref(fdb,"games/"+g.id),g).catch(function(e){alert("Save failed: "+e.message+"\n(If you see permission denied, apply the latest security rules from the Scorer access page of the cricket app; they include 'games'.)")})}
function setG(v){G=Object.keys(v||{}).map(function(k){var g=v[k]||{};g.id=g.id||k;g.st=g.st||"up";g.rd=g.rd||"";g.res=g.res||"";g.a=g.a||"";g.b=g.b||"";g.title=g.title||"";g.venue=g.venue||"";g.when=g.when||0;g.ts=g.ts||0;g.sp=g.sp||"volleyball";return g})}
function rowsToRd(){return ROWS.filter(function(p){return p[0]!==""&&p[1]!==""}).map(function(p){return (+p[0])+"-"+(+p[1])}).join(",")}
function grab(){if(!(ID&&ADMIN))return;ROWS=ROWS.map(function(p,i){var a=$("ra"+i),b=$("rb"+i);return a&&b?[a.value,b.value]:p})}
function busy(){var a=document.activeElement;return !!(a&&$("app").contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))}
function setHdr(){$("hb").textContent=ADMIN?"Logout":"Scorer login"}
function setDot(){$("dot").style.background=ONLINE?"#3ECF6E":"#D9482B"}

function loginView(){return '<button class="ghost" data-a="lcancel">Back</button><h1>Scorer login</h1><div class="card"><label for="lem">Email</label><input id="lem" type="email" autocomplete="username"><label for="lpw">Password</label><input id="lpw" type="password" autocomplete="current-password"><button class="primary" data-a="ldo">Login</button><p class="mute" id="lerr"></p></div>'}

function chip(g){return g.st=="live"?'<span class="live">LIVE</span>':g.st=="fin"?'<span class="mute">Finished</span>':'<span class="mute">Upcoming</span>'}
function card(g){var s=sp(g.sp),t=tally(g),has=parseRd(g.rd).length,rt=resTxt(g);
  return '<div class="card tap" data-a="gopen" data-id="'+g.id+'"><div class="row"><span class="mute">'+s.i+' '+esc(s.n)+(g.title?' | '+esc(g.title):'')+'</span>'+chip(g)+'</div><div style="margin:8px 0 4px"><b style="font-size:18px">'+esc(g.a)+'</b> <span class="mute">vs</span> <b style="font-size:18px">'+esc(g.b)+'</b></div><div class="mute">'+esc(whenT(g))+(g.venue?' | '+esc(g.venue):'')+'</div>'+((g.st!="up"&&(has||rt))?'<div style="margin-top:6px"><span class="sc">'+(has?t[0]+' - '+t[1]:'')+'</span> <span class="mute">'+esc(rt)+'</span></div>':'')+'</div>'}

function listView(){
  var h='<a href="./" style="color:var(--mute)">&larr; Cricket scorer</a><h1 style="margin-top:8px">Other games</h1>';
  h+='<div class="chips"><button data-a="sp" data-v="all" class="'+(SP=="all"?"on":"")+'">All</button>'+SPORTS.map(function(s){return '<button data-a="sp" data-v="'+s.k+'" class="'+(SP==s.k?"on":"")+'">'+s.i+' '+esc(s.n)+'</button>'}).join("")+'</div>';
  if(ADMIN){
    if(NEWF){
      h+='<div class="card"><h2>Schedule match</h2><label for="fs">Game</label><select id="fs">'+SPORTS.map(function(s){return '<option value="'+s.k+'"'+(SP==s.k?' selected':'')+'>'+esc(s.n)+'</option>'}).join("")+'</select><label for="fa">Team / Player 1</label><input id="fa"><label for="fb">Team / Player 2</label><input id="fb"><label for="ft">Round or title (optional, e.g. Semi Final)</label><input id="ft"><label for="fv">Venue (optional)</label><input id="fv"><label for="fw">Date and time</label><input id="fw" type="datetime-local"><button class="primary" data-a="gnew">Schedule</button><button class="ghost" data-a="fcancel" style="margin-top:8px">Cancel</button></div>';
    }else h+='<button class="primary" style="margin:0 0 12px" data-a="newf">Schedule match</button>';
  }
  var L=G.filter(function(g){return SP=="all"||g.sp==SP});
  var by=function(a,b){return (a.when||a.ts||0)-(b.when||b.ts||0)};
  var live=L.filter(function(g){return g.st=="live"}).sort(by),up=L.filter(function(g){return g.st=="up"}).sort(by),fin=L.filter(function(g){return g.st=="fin"}).sort(function(a,b){return by(b,a)});
  if(!L.length)h+='<div class="card mute">No matches yet.</div>';
  if(live.length){h+='<h2>Live</h2>'+live.map(card).join("")}
  if(up.length){h+='<h2>Upcoming</h2>'+up.map(card).join("")}
  if(fin.length){h+='<h2>Results</h2>'+fin.map(card).join("")}
  return h}

function detailView(g){
  var s=sp(g.sp),t=tally(g),rd=parseRd(g.rd),has=rd.length,rt=resTxt(g);
  var h='<button class="ghost" data-a="gback">Back</button><div class="board"><div class="row"><span class="sub">'+s.i+' '+esc(s.n)+(g.title?' | '+esc(g.title):'')+'</span>'+(g.st=="live"?'<span class="live">LIVE</span>':g.st=="fin"?'<span class="sub">Finished</span>':'<span class="sub">Upcoming</span>')+'</div>'
   +'<div class="row" style="margin-top:12px"><span class="team" style="font-size:20px">'+esc(g.a)+'</span><span class="num" style="font-size:44px">'+(has?t[0]:'-')+'</span></div>'
   +'<div class="row"><span class="team" style="font-size:20px">'+esc(g.b)+'</span><span class="num" style="font-size:44px">'+(has?t[1]:'-')+'</span></div>'
   +'<div class="sub" style="margin-top:8px">'+esc(whenT(g))+(g.venue?' | '+esc(g.venue):'')+'</div>'+(rt?'<div class="msg">'+esc(rt)+'</div>':'')+'</div>';
  if(has){h+='<div class="card"><h2>'+s.r+' scores</h2><table><tr><th></th><th class="r">'+esc(g.a)+'</th><th class="r">'+esc(g.b)+'</th></tr>'+rd.map(function(p,i){return '<tr><td>'+s.r+' '+(i+1)+'</td><td class="r"><b>'+p[0]+'</b></td><td class="r"><b>'+p[1]+'</b></td></tr>'}).join("")+'</table></div>'}
  else if(!ADMIN)h+='<div class="card mute">No score yet.</div>';
  if(!ADMIN)return h;
  h+='<div class="card"><h2>Enter score</h2><p class="mute">Enter the score of each '+s.r.toLowerCase()+'. The winner is worked out automatically.</p><div class="rd"><span></span><span class="mute">'+esc(g.a)+'</span><span class="mute">'+esc(g.b)+'</span></div>';
  ROWS.forEach(function(p,i){h+='<div class="rd"><span class="mute">'+s.r+' '+(i+1)+'</span><input id="ra'+i+'" type="number" inputmode="numeric" value="'+esc(p[0])+'"><input id="rb'+i+'" type="number" inputmode="numeric" value="'+esc(p[1])+'"></div>'});
  h+='<div class="row" style="margin-top:10px"><button class="ex" data-a="radd">+ '+s.r+'</button><button class="ex" data-a="rdel">Remove last</button></div><button class="primary" data-a="rsave">Save score</button></div>';
  h+='<div class="card"><h2>Match status</h2>';
  if(g.st=="up")h+='<button class="primary" style="margin-top:0" data-a="gst" data-v="live">Start match (go live)</button>';
  if(g.st=="live")h+='<label for="gres">Result</label><select id="gres"><option value="">Auto (from scores)</option><option value="a"'+(g.res=="a"?' selected':'')+'>'+esc(g.a)+' won</option><option value="b"'+(g.res=="b"?' selected':'')+'>'+esc(g.b)+' won</option><option value="d"'+(g.res=="d"?' selected':'')+'>Draw</option></select><button class="primary" data-a="gfin">Finish match</button>';
  if(g.st=="fin")h+='<button class="ex" style="width:100%" data-a="gst" data-v="live">Reopen (edit result)</button>';
  h+='</div>';
  h+='<div class="card"><h2>Details</h2><label for="gt">Round or title</label><input id="gt" value="'+esc(g.title)+'"><label for="gv">Venue</label><input id="gv" value="'+esc(g.venue)+'"><label for="gw">Date and time</label><input id="gw" type="datetime-local" value="'+(g.when?toLocalIn(g.when):'')+'"><button class="ex" style="width:100%;margin-top:12px" data-a="gdet">Save details</button></div>';
  h+='<button class="danger" data-a="gdel">Delete this match</button>';
  return h}

function show(){var h;
  if(!FB&&!READY)h='<div class="card"><h2>Could not connect</h2><p class="mute">Check your internet connection and reload the page.</p></div>';
  else if(LOGINV)h=loginView();
  else if(ID&&find(ID))h=detailView(find(ID));
  else{ID=null;h=listView()}
  $("app").innerHTML=h}

$("app").onclick=function(e){
  var el=e.target.closest("[data-a]");if(!el)return;var a=el.dataset.a,g;
  if(a=="sp"){SP=el.dataset.v;show()}
  else if(a=="newf"){NEWF=true;show()}
  else if(a=="fcancel"){NEWF=false;show()}
  else if(a=="gnew"){var na=$("fa").value.trim(),nb=$("fb").value.trim();
    if(!na||!nb){alert("Enter both names");return}
    var w=$("fw").value;
    g={id:uid(),sp:$("fs").value,a:na,b:nb,title:$("ft").value.trim(),venue:$("fv").value.trim(),when:w?new Date(w).getTime():0,st:"up",rd:"",res:"",ts:Date.now()};
    G.push(g);put(g);NEWF=false;show()}
  else if(a=="gopen"){ID=el.dataset.id;g=find(ID);ROWS=parseRd(g.rd).map(function(p){return[String(p[0]),String(p[1])]});if(!ROWS.length)ROWS=[["",""]];show();window.scrollTo(0,0)}
  else if(a=="gback"){ID=null;show()}
  else if(a=="radd"){grab();ROWS.push(["",""]);show()}
  else if(a=="rdel"){grab();if(ROWS.length>1)ROWS.pop();show()}
  else if(a=="rsave"){grab();g=find(ID);g.rd=rowsToRd();put(g);show()}
  else if(a=="gst"){grab();g=find(ID);g.rd=rowsToRd();g.st=el.dataset.v;put(g);show()}
  else if(a=="gfin"){grab();g=find(ID);g.rd=rowsToRd();g.res=$("gres").value;g.st="fin";put(g);show()}
  else if(a=="gdet"){g=find(ID);g.title=$("gt").value.trim();g.venue=$("gv").value.trim();var w2=$("gw").value;g.when=w2?new Date(w2).getTime():0;put(g);show()}
  else if(a=="gdel"){if(confirm("Delete this match?")){var did=ID;G=G.filter(function(x){return x.id!=did});ID=null;if(FB)FB.db.remove(FB.db.ref(fdb,"games/"+did)).catch(function(er){alert("Delete failed: "+er.message)});show()}}
  else if(a=="ldo"){var em=$("lem").value.trim(),pw=$("lpw").value;$("lerr").textContent="Logging in...";
    FB.auth.signInWithEmailAndPassword(fauth,em,pw).catch(function(){$("lerr").textContent="Login failed. Check your email and password."})}
  else if(a=="lcancel"){LOGINV=false;show()}
};
$("hb").onclick=function(){if(!FB)return;if(ADMIN){FB.auth.signOut(fauth)}else{LOGINV=true;show()}};
try{var cc=localStorage.getItem("sfc_games");if(cc){setG(JSON.parse(cc));READY=true}}catch(e){}
setDot();setHdr();show();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});
if(FB){
  FB.db.onValue(FB.db.ref(fdb,"games"),function(snap){var v=snap.val();try{localStorage.setItem("sfc_games",JSON.stringify(v||{}))}catch(e){}setG(v);READY=true;if(!busy())show()},function(e){$("app").innerHTML='<div class="card"><h2>Could not load data</h2><p class="mute">'+esc(e.message)+'<br>The security rules need a "games" section.</p></div>'});
  FB.db.onValue(FB.db.ref(fdb,".info/connected"),function(snap){ONLINE=!!snap.val();setDot()});
  FB.auth.onAuthStateChanged(fauth,function(u){ADMIN=!!u;LOGINV=false;setHdr();show()});
}
</script>
</body>
</html>
