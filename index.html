<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SFC Scorer</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#EAEEF4;--ink:#14203A;--board:#0C1B3D;--chalk:#F3F5E8;--tape:#F7B500;--wk:#D9482B;--card:#FFFFFF;--line:#D3DAE6;--mute:#5D6B82;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0A1226;--ink:#E8ECF6;--card:#121C36;--line:#25335A;--mute:#8E9BB8}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px}
.wrap{max-width:480px;margin:0 auto;padding:14px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700}
h1{font-size:28px;margin:4px 0 12px}h2{font-size:20px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(12,27,61,.08)}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--page);color:var(--ink)}
textarea{min-height:110px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 14px;font-weight:600;background:var(--board);color:var(--chalk)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
button:active{transform:scale(.97)}
.primary{width:100%;margin-top:14px;background:var(--tape);color:#16221C;font-size:17px}
.ghost{background:transparent;color:var(--mute);padding:6px 4px;text-decoration:underline}
.danger{background:transparent;color:var(--wk);padding:6px 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--board);color:var(--chalk)}
.lg{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--tape);color:#16221C;display:grid;place-items:center;font-weight:700;font-family:"Barlow Condensed",sans-serif;font-size:20px}
.lg.s{width:30px;height:30px;font-size:15px}
.mute{color:var(--mute);font-size:14px}
.board{background:var(--board);color:var(--chalk);border-radius:16px;padding:16px;margin-bottom:12px}
.live{background:var(--wk);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:20px}
.team{font-size:16px;display:flex;align-items:center;gap:8px}
.big{font-size:64px;line-height:1}.sub{font-size:15px;opacity:.85}
.balls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;min-height:34px}
.b{min-width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;background:rgba(243,245,232,.15);padding:0 6px}
.b.f{background:var(--tape);color:#16221C}.b.w{background:var(--wk);color:#fff}.b.x{border:2px solid var(--tape)}
.msg{margin-top:10px;font-size:15px;color:var(--tape);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{font-size:22px;font-family:"Barlow Condensed",sans-serif;padding:14px 0}
.g4{background:var(--tape)!important;color:#16221C!important}
.g6{background:#FF8A1F!important;color:#16221C!important}
.gw{background:var(--wk)!important}
.ex{background:var(--card)!important;color:var(--ink)!important;border:2px solid var(--line);font-size:16px!important;font-family:Barlow,sans-serif!important}
.small{font-size:14px;color:var(--mute);text-align:center;margin:6px 0}
.pl{font-size:16px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}th,td{padding:5px 3px;text-align:left;border-bottom:1px solid var(--line)}.r{text-align:right}summary{cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;color:#F3F5E8;border-bottom:3px solid var(--tape);background:radial-gradient(circle at 92% -30%,rgba(247,181,0,.35),transparent 55%),radial-gradient(circle at 8% 130%,rgba(60,110,230,.35),transparent 50%),linear-gradient(135deg,#091431,#12275A 65%,#0C1B3D)}
.top img{width:46px;height:46px;flex:none}.hn{font-size:26px;line-height:1;letter-spacing:.3px}.hs{font-size:13px;opacity:.8;margin-top:2px}
.dot{margin-left:auto;flex:none;width:10px;height:10px;border-radius:50%;background:#8896B3}.hb{padding:8px 12px;font-size:13px;background:rgba(255,255,255,.14);color:#F3F5E8;border:1px solid rgba(255,255,255,.25)}
.hide{display:none}
.brand{display:flex;align-items:center;gap:12px;margin:2px 0 14px}.brand img{width:64px;height:64px}.bn{font-size:30px;line-height:1}
@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<header class="top"><img id="hl" alt="Sports Fans Club logo"><div><div class="num hn">SFC Scorer</div><div class="hs">Sports Fans Club</div></div><span id="dot" class="dot"></span><button id="hb" class="hb">Scorer login</button></header>
<div class="wrap" id="app"></div>

  tm.players.forEach(function(n,i){var s=st[n],l;
    if(s)l='Runs '+s.r+' ('+s.b+' balls), 4s '+s.f+', 6s '+s.s+' | Wickets '+s.w+(s.bb?' ('+ov(s.bb)+' ov)':'');else l='Abhi koi match nahi khela';
    h+='<div class="card"><div class="row" style="justify-content:flex-start">'+lg(tm.pp[i],n)+'<div><b>'+esc(n)+'</b><br><span class="mute">'+l+'</span></div></div>'+(ADMIN?'<div style="margin-top:8px"><button data-a="pphoto" data-i="'+i+'">Photo</button> <button class="danger" data-a="delplayer" data-i="'+i+'">Hatayein</button></div>':'')+'</div>'});
  if(ADMIN)h+='<div class="card"><h2>Player add karein</h2><label for="npn">Naam</label><input id="npn"><label for="npf">Photo (optional)</label><input id="npf" type="file" accept="image/*"><div id="npp" style="margin-top:8px"></div><button class="primary" data-a="addplayer">Add player</button></div>';
  return h}
function standings(t){
  var R={};t.teams.forEach(function(x){R[x.name]={t:x,p:0,w:0,l:0,d:0,pt:0,rs:0,bf:0,rc:0,bb:0}});
  t.matches.forEach(function(m){var S=m.S;if(!S.done||!R[S.t[0]]||!R[S.t[1]])return;
    var r0=S.inn[0].r,r1=S.inn[1].r,w=r1>r0?S.order[1]:r1<r0?S.order[0]:-1;
    [0,1].forEach(function(k){var c=S.inn[k],bi=S.order[k],bs=c.w>=S.pl[bi]-1?S.ov*6:c.b,a=R[S.t[bi]],o=R[S.t[1-bi]];a.rs+=c.r;a.bf+=bs;o.rc+=c.r;o.bb+=bs});
    [0,1].forEach(function(ti){var a=R[S.t[ti]];a.p++;if(w==-1){a.d++;a.pt+=1}else if(w==ti){a.w++;a.pt+=2}else a.l++});
  });
  return Object.keys(R).map(function(k){var a=R[k];a.rr=a.bf?a.rs*6/a.bf:0;a.nrr=a.rr-(a.bb?a.rc*6/a.bb:0);return a}).sort(function(x,y){return y.pt-x.pt||y.nrr-x.nrr})}
function tableView(t){
  var h='<div class="card"><h2>Points table</h2>';
  if(!t.matches.some(function(m){return m.S.done}))return h+'<p class="mute">Abhi koi match khatam nahi hua. Match poora hone par table ban jaye gi.</p></div>';
  h+='<table><tr><th>Team</th><th class="r">P</th><th class="r">W</th><th class="r">L</th><th class="r">Pts</th><th class="r">RR</th><th class="r">NRR</th></tr>';
  standings(t).forEach(function(a){h+='<tr><td><div style="display:flex;align-items:center;gap:6px">'+lg(a.t.logo,a.t.name,"s")+esc(a.t.name)+'</div></td><td class="r">'+a.p+'</td><td class="r">'+a.w+'</td><td class="r">'+a.l+'</td><td class="r"><b>'+a.pt+'</b></td><td class="r">'+a.rr.toFixed(2)+'</td><td class="r">'+(a.nrr>=0?"+":"")+a.nrr.toFixed(3)+'</td></tr>'});
  return h+'</table><p class="mute">Jeet = 2 points, tie = 1 point. RR = team ka apna run rate. NRR = unka run rate minus opponents ka run rate (all out hone par poray overs ginay jatay hain).</p></div>'}
function img96(f,cb){var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas");c.width=c.height=96;var x=c.getContext("2d"),q=Math.min(im.width,im.height);x.drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,0,0,96,96);cb(c.toDataURL("image/jpeg",.8))};im.src=rd.result};rd.readAsDataURL(f)}
document.addEventListener("change",function(e){var el=e.target,f=el.files&&el.files[0];if(!f)return;
  if(el.id=="pph"){img96(f,function(d){var tm=team(TM);if(!tm)return;if(PIDX<0)tm.logo=d;else{padj(tm);tm.pp[PIDX]=d}save();show();el.value=""})}
  else if(el.id=="npf"){img96(f,function(d){NPP=d;$("npp").innerHTML=lg(d,"","s")})}
});
function show(){
  var y=window.scrollY,h;
  if(!FB)h='<div class="card"><h2>Connect nahi ho saka</h2><p class="mute">Internet check karein aur page dobara kholein.</p></div>';
  else if(ERR)h='<div class="card"><h2>Masla</h2><p class="mute">'+esc(ERR)+'</p></div>';
  else if(!READY)h='<div class="card"><p class="mute">Load ho raha hai...</p></div>';
  else if(LOGINV)h=loginView();
  else{
    if(T&&!tour()){T=null;M=null;TM=null}
    if(M&&!ms())M=null;
    if(TM&&!team(TM))TM=null;
    h=!T?home():M?matchView():TM?teamView():tourView();
  }
  $("app").innerHTML=h;window.scrollTo(0,y);
}

function endInn(S){
  var c=S.inn[S.i],lim=S.ov*6,allOut=S.pl[S.order[S.i]]-1;
  if(S.i==0){if(c.b>=lim||c.w>=allOut){S.i=1;S.target=c.r+1;S.pending="Innings break. "+S.t[S.order[1]]+" ko "+S.target+" runs chahiye."}}
  else{
    if(c.r>=S.target)S.done=S.t[S.order[1]]+" jeet gaya, "+(allOut-c.w)+" wicket se";
    else if(c.b>=lim||c.w>=allOut){var d=S.target-1-c.r;S.done=d==0?"Match tie":S.t[S.order[0]]+" jeet gaya, "+d+" run se"}
  }
}
function ball(type,r,o){
  var S=ms().S,c=S.inn[S.i];
  if(S.done||c.q.length)return;
  if(type=="nb"){S.nb=!S.nb;save();show();return}
  H.push(JSON.stringify(S));if(H.length>40)H.shift();
  S.pending="";
  var i0=S.i,bt=c.bt[c.st],bl=c.bl[c.bw],tok,cls="",legal=true,runs=0,over=false;
  if(type=="wd"){tok="Wd";cls="x";runs=1;legal=false;bl.r+=1}
  else if(type=="wk"){
    var ro=o.how=="Run out",oi=(ro&&o.who==1)?c.ns:c.st,ob=c.bt[oi];
    tok="W";cls="w";bt.b++;ob.o=1;ob.how=o.how;ob.fl=o.fielder||"";ob.bw=c.bw;c.w++;
    if(ro){
      bt.r+=o.runs;runs=o.runs;
      if(S.nb){tok="Nb+W";runs+=1;legal=false;S.nb=false;bl.r+=runs}else{bl.r+=runs;bl.b++}
      if(o.runs%2==1){var z=c.st;c.st=c.ns;c.ns=z}
    }else{bl.w++;bl.b++}
  }
  else{
    bt.r+=r;bt.b++;if(r==4)bt.f++;if(r==6)bt.s++;
    if(S.nb){tok="Nb"+(r?"+"+r:"");cls="x";runs=r+1;legal=false;S.nb=false;bl.r+=runs}
    else{tok=String(r);cls=r>=4?"f":"";runs=r;bl.r+=r;bl.b++}
    if(r%2==1){var x=c.st;c.st=c.ns;c.ns=x}
  }
  c.r+=runs;if(legal)c.b++;
  c.ol.push({t:tok,c:cls});
  if(legal&&c.b%6==0){c.last=c.ol.slice();c.ol=[];over=true}
  endInn(S);
  if(S.i!=i0||S.done)c.q=[];
  else{
    if(type=="wk")c.q.push("newbat");
    if(over){var y=c.st;c.st=c.ns;c.ns=y;c.pbw=c.bw;c.bw=-1;c.q.push("bowler")}
  }
  save();show();
}
function doSetup(){
  var S=ms().S,c=S.inn[S.i],k=c.q[0],v=function(id){return $(id)?+$(id).value:-1};
  if(k=="openers"){
    if(v("sst")==v("sns")){alert("Striker aur non-striker alag hon");return}
    c.st=v("sst");c.ns=v("sns");enter(c,c.st);enter(c,c.ns);c.bw=v("sbw");bowl(c,c.bw);
  }else if(k=="bowler"){c.bw=v("sbw");bowl(c,c.bw)}
  else if(k=="newbat"){var n=v("snb");if(n<0)return;if(c.bt[c.st]&&c.bt[c.st].o)c.st=n;else c.ns=n;enter(c,n)}
  c.q.shift();save();show();
}

$("app").onclick=function(e){
  var el=e.target.closest("[data-a]");if(!el)return;var a=el.dataset.a,t;
  if(a=="newtour"){var n=$("tn").value.trim();if(!n){alert("Tournament ka naam likhein");return}
    DB.tours.push({id:uid(),name:n,ov:+$("to").value,teams:[],matches:[],ts:Date.now()});save();show()}
  else if(a=="open"){T=el.dataset.id;TAB="teams";show()}
  else if(a=="deltour"){if(confirm("Ye tournament delete karein?")){DB.tours=DB.tours.filter(function(x){return x.id!=el.dataset.id});save();show()}}
  else if(a=="home"){T=null;show()}
  else if(a=="tab"){TAB=el.dataset.v;show()}
  else if(a=="addteam"){var nm=$("tmn").value.trim(),pl=$("tmp").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
    if(!nm){alert("Team ka naam likhein");return}
    tour().teams.push({id:uid(),name:nm,logo:LOGO,players:pl,pp:pl.map(function(){return ""}),ts:Date.now()});LOGO="";save();show()}
  else if(a=="delteam"){if(confirm("Ye team delete karein?")){t=tour();t.teams=t.teams.filter(function(x){return x.id!=el.dataset.id});save();show()}}
  else if(a=="newmatch"){t=tour();var A=team($("ma").value),B=team($("mb").value);
    if(A.id==B.id){alert("Do alag teams chunein");return}
    var f=+$("mf").value;
    var S={t:[A.name,B.name],lg:[A.logo,B.logo],ov:+$("mo").value,pn:[pnames(A),pnames(B)],nb:false,pl:[Math.max(2,pnames(A).length),Math.max(2,pnames(B).length)],order:f==0?[0,1]:[1,0],i:0,target:0,done:"",pending:"",inn:[mkInn(),mkInn()]};
    var m={id:uid(),S:S,ts:Date.now()};t.matches.push(m);M=m.id;H=[];save();show()}
  else if(a=="openmatch"){M=el.dataset.id;H=[];fix(ms().S);save();show()}
  else if(a=="backm"){WKO=false;M=null;TAB="matches";show()}
  else if(a=="run")ball("run",+el.dataset.r);
  else if(a=="setup")doSetup();
  else if(a=="wk"){var S0=ms().S;if(!S0.inn[S0.i].q.length){WKO=true;show()}}
  else if(a=="wkok"){var S2=ms().S,bi2=S2.order[S2.i],hw2=$("hw").value,fi=$("hf").value,ro2=hw2=="Run out";WKO=false;
    ball("wk",0,{how:hw2,fielder:(fi===""||$("rowf").classList.contains("hide"))?"":S2.pn[1-bi2][+fi],who:ro2?+$("hb").value:0,runs:ro2?+$("hr").value:0})}
  else if(a=="wkno"){WKO=false;show()}
  else if(a=="wd")ball("wd");
  else if(a=="nb")ball("nb");
  else if(a=="ldo"){var em=$("lem").value.trim(),pw=$("lpw").value;$("lerr").textContent="Login ho raha hai...";
    FB.auth.signInWithEmailAndPassword(fauth,em,pw).catch(function(){$("lerr").textContent="Login nahi hua. Email ya password check karein."})}
  else if(a=="lcancel"){LOGINV=false;show()}
  else if(a=="delmatch"){if(confirm("Ye match delete karein?")){t=tour();t.matches=t.matches.filter(function(x){return x.id!=el.dataset.id});save();show()}}
  else if(a=="openlive"){T=el.dataset.t;M=el.dataset.id;H=[];fix(ms().S);show()}
  else if(a=="swap"){var S1=ms().S,c1=S1.inn[S1.i];if(!c1.q.length&&c1.st>=0){var x1=c1.st;c1.st=c1.ns;c1.ns=x1;save();show()}}
  else if(a=="team"){TM=el.dataset.id;show()}
  else if(a=="backt"){TM=null;TAB="teams";show()}
  else if(a=="pphoto"){PIDX=+el.dataset.i;$("pph").click()}
  else if(a=="tlogo"){PIDX=-1;$("pph").click()}
  else if(a=="delplayer"){var tm1=team(TM),i1=+el.dataset.i;if(confirm("Player hata dein?")){tm1.players.splice(i1,1);padj(tm1);tm1.pp.splice(i1,1);save();show()}}
  else if(a=="addplayer"){var nn=$("npn").value.trim();if(!nn){alert("Player ka naam likhein");return}var tm2=team(TM);padj(tm2);tm2.players.push(nn);tm2.pp.push(NPP);NPP="";save();show()}
  else if(a=="undo"){WKO=false;if(H.length){ms().S=JSON.parse(H.pop());save();show()}}
};
$("app").onchange=function(e){
  if(e.target.id=="hw"){var v=e.target.value;$("rowf").classList.toggle("hide",!(v=="Caught"||v=="Stumped"||v=="Run out"));$("rowb").classList.toggle("hide",v!="Run out");return}

    x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);
    LOGO=c.toDataURL("image/jpeg",.8);$("lp").innerHTML=lg(LOGO,"")};im.src=rd.result};

}
